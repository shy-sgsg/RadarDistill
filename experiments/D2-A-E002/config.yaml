experiment:
  id: D2-A-E002
  title: Independent truth-only TaskStudent feasibility pilot
  status: protocol_proposal
  date: 2026-10-25
  baseline_experiment: D2-A-E001
  independent_of: D2-A-R3
  data_are_synthetic: true
  protocol_only_this_revision: true
  training_authorized: false
  distillation_authorized: false
  final_blind_generation_authorized: false
  research_charter: docs/RESEARCH_CHARTER.md
  research_charter_version: v1.1

radar:
  prf_hz: 1300.0
  pulse_count: 130
  channel_count: 3
  range_bin_count: 32
  iq_representation: distance_compressed_complex64
  inference_input: [batch, 6, 130, 32]
  inference_channel_order: [I_ch0, I_ch1, I_ch2, Q_ch0, Q_ch1, Q_ch2]

physical_model:
  source_config: experiments/D2-A-E001/config.yaml
  source_protocol_immutable: true
  clutter: stationary_ground_scatterers
  channels: ideal
  target_count_h1: 1
  target_count_h0: 0
  scenarios_train_validation_development: [separated, near_clutter_edge, partial_overlap]
  scenario_velocity_mps:
    separated: 4.0
    near_clutter_edge: 1.2
    partial_overlap: 0.4
  operating_points_snr_cnr_db:
    - [0.0, 10.0]
    - [10.0, 0.0]
    - [10.0, 10.0]
    - [10.0, 20.0]
    - [20.0, 10.0]
  target_reference_amplitude_db: [-6.0, 6.0]
  target_initial_phase_rad: [0.0, 6.283185307179586]
  channel_calibration_error: none
  additional_physics: none

data:
  split_unit: base_scene_id
  paired_h0_h1_share_background_and_noise: true
  no_shared_base_scene_across_splits: true
  train:
    base_scene_pairs: 50000
    scenarios: [separated, near_clutter_edge, partial_overlap]
    operating_point_weights: equal
    scenario_weights: equal
    sample_strategy: stratified_near_equal
    batch_sampling: 32_base_scene_pairs_per_update_both_h0_h1
    base_scene_pair_presentations_at_1600_updates: 51200
    seed_start: 17000000
  validation:
    base_scene_pairs: 5000
    scenarios: [separated, near_clutter_edge, partial_overlap]
    operating_point_weights: equal
    scenario_weights: equal
    seed_start: 17100000
  h0_calibration:
    h0_scenes: 15000
    fixed_calibration_mixture: true
    sampling_mixture: equal_weight_random_draw_over_operating_point_and_amplitude_bin
    amplitude_bin_edges_db: [-6.0, -3.0, 0.0, 3.0, 6.0]
    seed_start: 17200000
  h0_verification:
    h0_scenes: 15000
    same_iid_mixture_as_calibration: true
    independent_from_calibration: true
    seed_start: 17300000
  development:
    paired_h0_h1_scenes: 5000
    scenario_operating_point_grid: balanced_3_by_5
    allocation_rule: scenario_major_then_config_operating_point_order_first_five_cells_334_each_other_cell_333
    seed_start: 17400000
    use_for_threshold_selection: false
    use_for_hyperparameter_search: false
  identifiability_boundary:
    paired_h0_h1_scenes: 1024
    scenario: exact_overlap
    descriptive_only: true
    required_to_recover_unique_source_label: false
    seed_start: 17500000
  final_blind:
    materialize: false
    seed_range_reserved_not_assigned: true
  cached_full_dataset_on_gpu: false
  generation_mode: stream_or_cpu_batch

student:
  architecture: D1-E001_TaskStudent
  source: src/radardistill/students/task_student.py
  reuse_checkpoint: false
  include_spectrum_head: false
  backbone_width: 32
  temporal_dilations: [1, 2, 4, 8, 16, 32, 64]
  inference_heads: [presence_logit, range_logits, range_offset, unit_doppler_cos_sin]
  inference_fft: false
  inference_dpca: false
  inference_cfar: false
  training_teacher_losses: []

training:
  objective: physical_truth_only
  pilot_seed: 101
  optimizer: AdamW
  optimizer_updates: 1600
  effective_batch_size: 64
  microbatch_size: 16
  gradient_accumulation_steps: 4
  oom_microbatch_fallback: 8
  oom_fallback_accumulation_steps: 8
  learning_rate_initial: 0.001
  learning_rate_final: 0.0001
  learning_rate_schedule: cosine
  weight_decay: 0.0001
  max_gradient_norm: 1.0
  precision: FP32
  loss:
    presence_bce_weight: 1.0
    range_cell_cross_entropy_weight: 1.0
    range_offset_smooth_l1_weight: 1.0
    range_offset_smooth_l1_beta: 0.1
    doppler_circular_cosine_weight: 1.0
    parameter_loss_mask: H1_only
    teacher_kl_weight: 0.0
    teacher_hard_label_weight: 0.0
  checkpoint_selection: minimum_validation_truth_task_loss
  validation_interval_updates: 100
  data_generation: CPU_on_demand
  cuda_required: true
  expected_device: NVIDIA GeForce RTX 3050 Laptop GPU
  cpu_fallback: forbidden
  simultaneous_training_jobs: 1
  stop_if_microbatch_8_oom: true

detection:
  score: presence_logit
  target_pfa_cpi: 0.05
  calibration_quantile: 0.95
  calibration_quantile_method: higher
  decision_comparator: ">="
  report_strict_greater_and_inclusive_tie_counts: true
  primary_pfa_limit: 0.06
  primary_pfa_interval: one_sided_exact_clopper_pearson_95
  calibration_quantile_bootstrap_replicates: 2000
  calibration_quantile_bootstrap_seed: 2026102503
  primary_gate_also_requires_point_estimate_at_most: 0.06
  subgroup_guardrail_pfa_limit: 0.10
  subgroup_guardrail_interval: one_sided_exact_clopper_pearson_95
  subgroup_guardrail_claims_simultaneous_coverage: false
  calibration_and_verification_thresholds_are_method_specific: true
  threshold_uses_snr_cnr_or_truth_at_inference: false

baselines:
  E0_simple_cpi_energy:
    score: max_range_sum_channel_and_pulse_iq_power
  B0: frozen_D2-A-E001_channel_0_FFT_peak
  B1: frozen_D2-A-E001_three_channel_noncoherent_RD_peak
  B2: frozen_D2-A-E001_geometry_aware_coherent_azimuth_search
  B3: frozen_D2-A-E001_raw_DPCA
  T1: frozen_D2-A-R3_scene_wide_normalized_DPCA_candidate
  T1_formal_teacher_approved: false
  use_same_calibration_and_verification_scene_ids: true
  calibrate_each_score_with_its_own_threshold: true
  compare_pd_at_common_empirical_roc_pfa: 0.05
  compare_auc_and_actual_pfa: true
  oracle_or_hidden_truth_as_detector_input: false

statistics:
  confidence_level: 0.95
  pfa_primary_interval: exact_one_sided_clopper_pearson
  paired_scene_bootstrap_replicates: 2000
  bootstrap_seed: 2026102502
  physical_diagnostic_seed: 2026102504
  bootstrap_unit: base_scene_id
  roc_auc_interval: paired_base_scene_bootstrap
  rmse_interval: recompute_rmse_per_bootstrap_replicate
  joint_success_counts_misses_as_failure: true
  multiplicity_adjustment_for_secondary_diagnostics: none_descriptive_only

gates:
  G1_engineering:
    split_ids_disjoint: true
    paired_h0_h1_background_and_noise_match: true
    model_input_contains_only_iq: true
    no_truth_or_scene_metadata_in_detector: true
    existing_physics_and_pairing_tests_required_before_run: true
    expected_cuda_device_required: true
  G2_task_learning:
    population: pooled_A_B_C_development
    student_auc_lower_95_ci_gt: 0.5
    min_auc_point_gain_vs_E0: 0.02
    auc_gain_paired_95_ci_lower_gt: 0.0
    pd_at_common_roc_fpr: 0.05
    pd_difference_vs_E0_at_common_fpr_paired_95_ci_lower_gt: -0.05
  G3_detection:
    h0_verification_scenes: 15000
    point_pfa_max: 0.06
    one_sided_cp_95_upper_max: 0.06
    threshold_from_independent_h0_calibration_only: true
    all_cnr_and_amplitude_subgroups_reported: true
    subgroup_one_sided_cp_95_upper_max: 0.10
  G4_parameter_learning:
    population: pooled_A_B_C_development
    range_rmse_vs_train_median_baseline_paired_95_ci_upper_lt: 0.0
    circular_doppler_rmse_vs_train_circular_mean_baseline_paired_95_ci_upper_lt: 0.0
    joint_success_definition: detection_and_abs_range_error_le_1_bin_and_wrapped_doppler_error_le_20_hz
    primary_condition: {scenario: separated, snr_db: 10.0, cnr_db: 10.0}
    primary_joint_success_point_min: 0.5
    primary_joint_success_one_sided_95_ci_lower_min: 0.4
    misses_are_joint_failures: true
    exact_overlap_is_gate: false
  G5_physical_diagnostics:
    common_phase_rotation:
      random_rotation_count: 32
      decision_agreement_min: 0.99
      range_error_abs_95_percentile_max_bins: 0.25
      wrapped_doppler_change_95_percentile_max_hz: 5.0
      auc_absolute_change_max: 0.01
    target_only_doppler_shift_hz: [-25.0, -10.0, 10.0, 25.0]
    target_only_doppler_shift_95_percentile_residual_max_hz: 10.0
    target_only_shift_range_median_change_max_bins: 0.25
    amplitude_scales: [0.5, 2.0]
    amplitude_scale_threshold_recalibration: false
    amplitude_scale_flag_pfa_point_gt: 0.10
    amplitude_scale_flag_pd_absolute_drop_gt: 0.10
    channel_coherence_ablation: independent_constant_phase_per_channel
    amplitude_and_coherence_are_diagnostics_not_distributional_accuracy_claims: true
    amplitude_or_coherence_flags_limit_robustness_claims_only: true

reproducibility:
  rng_streams: [python, numpy, torch_cpu, torch_cuda, scene_generation]
  save_initial_best_and_final_checkpoints: true
  save_config_environment_training_history_and_peak_cuda_memory: true
  capture_nvidia_smi_before_and_after: true
  expected_runtime_measured_only_after_authorized_run: true

execution:
  planned_preflight_command: python scripts/run_d2a_e002.py --config experiments/D2-A-E002/config.yaml --stage preflight
  planned_pilot_command: python scripts/run_d2a_e002.py --config experiments/D2-A-E002/config.yaml --stage pilot --seed 101 --device cuda:0
  commands_executable_in_this_revision: false
  training_requires_separate_explicit_approval: true
