  B_near_edge:
    scenario_id: near_clutter_edge
    description: target Doppler is close to the beam-limited stationary-clutter edge
  C_partial_overlap:
    scenario_id: partial_overlap
    description: target Doppler overlaps while range/angle support remains distinguishable
  D_exact_overlap:
    scenario_id: exact_overlap
    description: target shares one clutter point's range-angle-slow-time manifold;
      source attribution is non-identifiable
