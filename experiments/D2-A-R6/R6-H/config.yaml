  frequency_shift_intervention_hz: [-130.0, 130.0]
  final_blind_authorized: false

resources:
  required_gpu_name: NVIDIA GeForce RTX 3050 Laptop GPU
  required_device: cuda:0
  simultaneous_models_resident: 1
  data_loading: CPU_cache_to_CUDA_per_microbatch
  cleanup_owner_scoped_only: true
  preserve_untracked_user_data: true
