experiment:
  id: D2-A-R6
  subphase: R6-E
  protocol_version: 1.0
  status: preregistered
  charter_version: 1.3
  execution_authorized: true
  final_blind_authorized: false
  review_request_timing: after_all_authorized_R6_P0_P7_goals
  objective: matched_single_seed_architecture_screen

radar:
  channel_count: 3
  prf_hz: 1300.0
  pulse_count: 130
  range_bin_count: 32
  clutter: stationary
  source_config: experiments/D2-A-E001/config.yaml
  condition_source: experiments/D2-A-R6/R6-A/config.yaml
  condition_count: 12

models:
  baseline: R6J1Student_width96_shared_task_trunk
  baseline_inference_parameters_expected: 70277
  candidates:
    ce_tcn:
      architecture: complex_equivariant_residual_tcn
      initial_width: 64
      range_stem_kernel: [1, 3]
      temporal_block_count: 7
      temporal_depthwise_kernel: [3, 1]
      temporal_dilations: [1, 2, 4, 8, 16, 32, 64]
      residual_pointwise_complex_mix: true
      physical_frontend: none
      complex_weights: learnable_bias_free
      activation: radial_modrelu
      normalization: phase_invariant_complex_group_rms
      normalization_groups: 8
      normalization_epsilon: 0.00000001
      normalization_affine: real_channel_scale_without_offset
      modrelu_epsilon: 0.00000001
      expected_common_phase_feature_equivariance: true
      expected_common_phase_task_invariance: true
      doppler_shift_equivariance_guaranteed: false
    rax_transformer:
      architecture: raw_iq_full_grid_axial_transformer
      embedding_dimension: 48
      attention_heads: 4
      axial_blocks: 2
      block_order: [slow_time_attention, range_attention, tokenwise_ffn]
      feedforward_dimension: 96
      activation: GELU
      normalization: pre_layernorm
      dropout: 0.0
      causal_attention: false
      attention_mask: none
      absolute_position_embedding: false
      slow_time_position: per_head_learnable_relative_lag_bias_-129_to_129
      range_position: per_head_learnable_relative_distance_bias_-31_to_31
      pool_time_after_axial_blocks: true
      physical_frontend: none
      expected_common_phase_invariance: false
      doppler_shift_equivariance_guaranteed: false
  parameter_match_relative_tolerance: 0.20
  one_parameter_count_only_adjustment_allowed: true
  report_inference_and_trainable_parameters: true
  teacher_inputs: false
  fixed_fft_frontend: false
  shared_task_output_contract: [presence_logit, range_logits, range_offset, doppler_vector]

data:
  source_conditions: experiments/D2-A-R6/R6-A/config.yaml
  condition_seed_stride: 1000000
  condition_offset_stride: 850000
  chunk_size: 16
  chunk_seed_stride: 1009
  g1_test_seed: 2300000000
  splits:
    train:
      paired_scenes: 51200
      seed_bases_by_course: [2008000000, 2013000000, 2018000000, 2023000000]
      assignment_seed: 2026110101
    validation:
      paired_scenes: 5000
      seed_bases_by_course: [2028000000, 2033000000, 2038000000, 2043000000]
      assignment_seed: 2026110102
    h0_calibration:
      presence: H0
      scene_count: 120000
      count_per_condition: 10000
      seed_base: 2108000000
    h0_verification:
      presence: H0
      scene_count: 120000
      count_per_condition: 10000
      seed_base: 2128000000
    h1_development:
      presence: H1
      scene_count: 6144
      count_per_condition: 512
      seed_base: 2148000000
  training_seed: 606
  sampler_seed: 607
  reuse_any_existing_scene_ids: false
  same_scene_order_across_models: true
  persist_train_validation_iq_temporarily: true
  persist_evaluation_iq: false
  estimated_train_validation_cache_bytes: 11222016000
  minimum_free_disk_bytes_before_generation: 15516983296
  final_project_limit_gib: 20

training:
  supervision: physical_truth_only_E1
  loss_function: r6d_loss_j1_joint
  optimizer: AdamW
  learning_rate_initial: 0.001
  learning_rate_final: 0.00001
  learning_rate_schedule: single_cosine_over_all_updates
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  effective_batch_size_cpi: 64
  per_update_examples: {H0: 32, H1: 32}
  fixed_updates_per_model: 51200
  exposure_per_presence_cpi: 1638400
  expected_scene_visits_per_presence: 32
  updates_are_screen_budget_not_convergence_claim: true
  validation_interval_updates: 400
  resume_checkpoint_interval_updates: 800
  history_written_every_update: false
  microbatch_initial: 16
  microbatch_candidates_after_oom: [8, 4]
  g1_micro_overfit_pairs: 16
  g1_micro_overfit_updates: 200
  g1_min_relative_loss_reduction: 0.10
  oom_preserve_effective_batch: true
  precision: FP32
  amp: false
  device: cuda:0
  required_gpu: NVIDIA GeForce RTX 3050 Laptop GPU
  cuda_required: true
  cpu_fallback: forbidden
  simultaneous_models_on_gpu: 1
  train_models_sequentially: [j1_joint, ce_tcn, rax_transformer]

evaluation:
  checkpoint_selection: minimum_per_model_validation_joint_truth_loss
  threshold_source: each_model_h0_calibration_only
  target_pfa_cpi: 0.05
  quantile_method: higher
  threshold_comparator: ">="
  primary_metric: identifiable_C2_C3_joint_success
  primary_contrasts: [ce_tcn_minus_j1_joint, rax_transformer_minus_j1_joint]
  primary_meaningful_gain: 0.02
  paired_bootstrap_unit: base_scene_id
  paired_bootstrap_replicates: 2000
  paired_bootstrap_seed: 2026110104
  candidate_contrast_ci_level: 0.975
  candidate_contrasts_familywise_ci: true
  pd_noninferiority_difference_lower_minimum: -0.02
  range_rmse_ratio_upper_maximum: 1.05
  doppler_rmse_ratio_upper_maximum: 1.05
  protection_contrast_ci_level: 0.975
  h1_pd_interval: two_sided_clopper_pearson_95
  pfa_interval: one_sided_clopper_pearson_95
  c3_conditions: 6
  c3_familywise_alpha: 0.05
  c3_cell_interval_method: bonferroni_exact
  c3_cell_pfa_upper_max_for_protection: 0.10
  h0_verification_for_model_selection: false
  h1_development_for_model_selection: false
  h1_development_is_final_blind: false
  common_phase_rotation_count: 16
  frequency_shift_intervention_hz: [-130.0, 130.0]
  report_all_conditions: true
  report_training_curve_endpoint_trend: true
  report_train_validation_gap_and_exposure: true
  report_parameters_cuda_peak_memory_and_wall_time: true

resources:
  train_cache_cleanup: only_r6e_owner_manifest
  preserve_untracked_user_data: true
  cuda_training_sequential: true
  project_final_limit_gib: 20
