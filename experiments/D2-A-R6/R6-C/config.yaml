experiment:
  id: D2-A-R6
  subphase: R6-C
  protocol_version: 1.1
  status: preregistered
  charter_version: 1.3
  execution_authorized: true
  final_blind_authorized: false
  review_request_timing: after_all_authorized_R6_P0_P7_goals
  objective: model_scale_training_budget_and_training_data_scale

radar:
  channel_count: 3
  prf_hz: 1300.0
  pulse_count: 130
  range_bin_count: 32
  clutter: stationary
  source_config: experiments/D2-A-E001/config.yaml
  condition_source: experiments/D2-A-R6/R6-A/config.yaml
  condition_count: 12

models:
  architecture: TaskStudent_original_complex_IQ_real_imag_planes
  physical_frontend: none
  include_spectrum_head: false
  training_seed: 404
  vary_only: width
  candidates:
    Medium:
      width: 96
      active_trainable_parameters: 70277
      inference_parameters: 70277
    Large:
      width: 200
      active_trainable_parameters: 292005
      inference_parameters: 292005
    XLarge:
      width: 376
      active_trainable_parameters: 1012197
      inference_parameters: 1012197
  legacy_medium_total_with_unused_spectrum_head_parameters: 82887
  report_unused_head_separately: true

data:
  condition_seed_stride: 1000000
  chunk_size: 16
  chunk_seed_stride: 1009
  core_train_pairs: 51200
  extended_train_pairs: 102400
  extended_contains_core: true
  cache_root: experiments/D2-A-R6/R6-C/cache/training
  estimated_train_validation_cache_bytes: 21445632000
  minimum_free_disk_bytes_before_data_generation: 25740599296
  validation_pairs: 5000
  splits:
    train_extended:
      seed_bases_by_course: [1608000000, 1613000000, 1618000000, 1623000000]
      assignment_seed: 2026103001
    validation:
      seed_bases_by_course: [1628000000, 1633000000, 1638000000, 1643000000]
      assignment_seed: 2026103002
    h0_calibration:
      presence: H0
      scenes: 120000
      count_per_condition: 10000
      seed_base: 1708000000
    h0_verification:
      presence: H0
      scenes: 120000
      count_per_condition: 10000
      seed_base: 1728000000
    h1_development:
      presence: H1
      scenes: 6144
      count_per_condition: 512
      seed_base: 1748000000
  pair_assignment_seed: 2026103003
  reuse_r5_or_r6_scene_ids: false
  same_iq_across_models: true
  persist_evaluation_iq: false
  persist_training_iq_temporarily: true
  final_blind: false

training:
  supervision: physical_truth_only_E1
  optimizer: AdamW
  learning_rate_initial: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  effective_batch_size_cpi: 64
  per_update_examples: {H0: 32, H1: 32}
  fixed_updates_initial: 12800
  update_checkpoints: [12800, 25600, 51200]
  validation_interval_updates: 400
  resume_checkpoint_interval_updates: 800
  history_written_every_update: false
  extension_learning_rates:
    initial_final_lr_after_12800: 0.00001
    final_lr_after_25600: 0.000001
    final_lr_after_51200: 0.0000001
  extension_rule:
    extension_pair: [Medium, validation_best_of_Large_XLarge]
    continue_both_or_neither: true
    trend_window_start_update_offsets: [1600, 1200, 800, 400, 0]
    relative_task_loss_drop_minimum: 0.01
    nonworsening_intervals_required: 3
    allowed_relative_interval_increase: 0.005
    max_subtask_or_rmse_degradation: 0.05
    max_auc_drop: 0.01
    max_range_mismatch_increase: 0.01
    max_overfit_gap_increase: 0.01
  microbatch_candidates: [16, 8, 4, 2]
  oom_preserve_effective_batch: true
  precision: FP32
  amp: false
  device: cuda:0
  required_gpu: NVIDIA GeForce RTX 3050 Laptop GPU
  cuda_required: true
  cpu_fallback: forbidden
  simultaneous_models_on_gpu: 1

data_scale_comparison:
  model: Medium
  seed: 404
  optimizer_updates: 12800
  effective_batch_size_cpi: 64
  contrast: 51200_vs_102400_unique_training_scene_pairs
  nested_train_cohorts: true
  total_examples_exposed_matched: true
  extra_exposure_search_authorized: false

evaluation:
  checkpoint_selection: minimum_common_validation_truth_task_loss
  threshold_source: h0_calibration_only
  quantile_method: higher
  threshold_comparator: ">="
  primary_pfa_cpi: 0.05
  primary_task_metric: identifiable_C2_C3_joint_success
  meaningful_joint_success_gain: 0.02
  scale_comparison_familywise_alpha: 0.05
  scale_comparison_candidates_vs_medium: 2
  scale_comparison_ci_level_after_bonferroni: 0.975
  paired_joint_ci_lower_must_exceed_zero: true
  max_overall_pd_degradation: 0.02
  max_range_or_doppler_rmse_ratio_upper: 1.05
  c3_pooled_pfa_upper_max_for_formal_seed_advancement: 0.10
  c3_cell_pfa_upper_max_for_formal_seed_advancement: 0.10
  secondary_pfa_cpi: [0.01, 0.001]
  pfa_interval: one_sided_clopper_pearson_95
  c3_cells: 6
  c3_familywise_alpha: 0.05
  c3_cell_interval_method: bonferroni_exact
  paired_bootstrap_unit: base_scene_id
  paired_bootstrap_replicates: 2000
  h0_verification_for_model_selection: false
  h1_development_for_final_blind: false
  report_all_h1_metrics: true
  report_train_validation_gap: true
  report_unique_scene_exposure_and_passes: true
  report_trainable_and_inference_parameters: true
  report_cuda_peak_memory_and_wall_clock: true

resources:
  train_cache_cleanup: only_stage_owner_manifest
  preserve_untracked_user_data: true
  final_project_limit_gib: 20
